# Builds every Horus app and publishes a release with stable file names.
# This repo (Lukefen31/horus-releases) holds only the native shells, synced
# from the private product repo by apps/scripts/sync-releases-repo.mjs, so
# the release can be created with the repo's own token and the downloads
# are public. Run it from the Actions tab (version, e.g. 1.0.0) or push a
# tag v<version>.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      notes:
        description: "Release notes (one line is fine)"
        required: false
        default: ""
      testflight:
        description: "Upload the iPhone/iPad builds to App Store Connect (TestFlight) when the API key is configured"
        required: false
        default: "true"
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [club, member, home]
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - name: Brand assets and native project
        run: |
          node scripts/brand-assets.mjs
          cd ${{ matrix.app }}
          npx @capacitor/assets generate --iconBackgroundColor "#4E2A74" --iconBackgroundColorDark "#4E2A74" --splashBackgroundColor "#F1F6F3" --splashBackgroundColorDark "#09110F"
          npx cap sync android
          node ../scripts/patch-native.mjs
      - name: Upload key (when configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build
        working-directory: apps/native/${{ matrix.app }}/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then ./gradlew --no-daemon bundleRelease assembleRelease; else ./gradlew --no-daemon assembleDebug; fi
      - uses: actions/upload-artifact@v4
        with:
          name: horus-${{ matrix.app }}-android
          path: |
            apps/native/${{ matrix.app }}/android/app/build/outputs/apk/**/*.apk
            apps/native/${{ matrix.app }}/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  ios:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        app: [club, member, home]
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode (App Store uploads need Xcode 26 or later)
        run: |
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -vi beta | python3 -c "import sys,re; l=[x.strip() for x in sys.stdin if x.strip()]; print(max(l, key=lambda p: [int(n) for n in re.findall(r'\d+', p.split('Xcode_')[1])]) if l else '')")"
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 26 or later on this runner"; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Brand assets and native project
        run: |
          node scripts/brand-assets.mjs
          cd ${{ matrix.app }}
          npx @capacitor/assets generate --iconBackgroundColor "#4E2A74" --iconBackgroundColorDark "#4E2A74" --splashBackgroundColor "#F1F6F3" --splashBackgroundColorDark "#09110F"
          npx cap sync ios
          node ../scripts/patch-native.mjs
      - name: Build, sign and upload
        working-directory: .
        env:
          # App Store Connect API key and Apple Distribution certificate: with them the build is signed (and uploaded to TestFlight); without them, unsigned.
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: bash apps/native/scripts/ios-build.sh ${{ matrix.app }} ${{ github.run_number }} ${{ github.event.inputs.testflight || 'true' }}
      - uses: actions/upload-artifact@v4
        with:
          name: horus-${{ matrix.app }}-ios
          path: |
            ${{ runner.temp }}/out-${{ matrix.app }}/*.zip
            ${{ runner.temp }}/out-${{ matrix.app }}/*.ipa
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-15
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run icons
      - name: Build
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # Notarisation with the App Store Connect API key (no Apple ID password needed).
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          WIN_CERT: ${{ secrets.WIN_CSC_LINK }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ "${{ matrix.target }}" = "--mac" ] && [ -n "$MAC_CERT_P12_BASE64" ]; then
            export CSC_LINK="$MAC_CERT_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            if [ -n "$ASC_KEY_P8_BASE64" ]; then
              printf '%s' "$ASC_KEY_P8_BASE64" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/AuthKey_notary.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_notary.p8" APPLE_API_KEY_ID="$ASC_KEY_ID" APPLE_API_ISSUER="$ASC_ISSUER_ID"
            fi
          elif [ "${{ matrix.target }}" = "--win" ] && [ -n "$WIN_CERT" ]; then
            export CSC_LINK="$WIN_CERT" CSC_KEY_PASSWORD="$WIN_CERT_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: horus-desktop-${{ runner.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          if-no-files-found: error

  publish:
    needs: [android, ios, desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish the release with stable file names
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          V="${VERSION#v}"
          ls -R out | head -40
          if [ -n "$NOTES" ]; then node apps/scripts/publish-release.mjs "$V" out --notes "$NOTES"; else node apps/scripts/publish-release.mjs "$V" out; fi
