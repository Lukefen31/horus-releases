<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Horus</title>
    <style>
      html, body { margin: 0; height: 100%; background: #F1F6F3; color: #0B231C; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px; text-align: center; }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 0; font-size: 15px; line-height: 1.5; color: #34493F; max-width: 40ch; }
      button { margin-top: 8px; padding: 10px 18px; border-radius: 8px; border: 1px solid #4E2A74; background: #4E2A74; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Horus can't reach the server</h1>
      <p>Check the connection and try again. Pages you opened recently may still work once the app is back online.</p>
      <button onclick="location.href = new URLSearchParams(location.search).get('url') || 'https://horus.farm/club'">Try again</button>
    </main>
  </body>
</html>
